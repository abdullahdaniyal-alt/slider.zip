<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Development Slider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="head"><h1>Web Development Essentials</h1><p>Browse with the arrows, dots, swipe or arrow keys.</p></div>
    <section class="slider" id="slider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Web development images">
        <figure class="slide active" aria-hidden="false">
          <img src="/slide1.jpg" alt="A code editor showing HTML code">
          <figcaption><h2>Write Clean Code</h2><p>Structure your pages with clear, readable HTML.</p></figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="slide2.jpg" alt="A website shown on a laptop, tablet and phone" loading="lazy">
          <figcaption><h2>Responsive Design</h2><p>One layout that adapts to desktop, tablet and mobile.</p></figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="slide3.jpg" alt="A modern website landing page in a browser" loading="lazy">
          <figcaption><h2>Modern Interfaces</h2><p>Turn ideas into fast, beautiful and usable websites.</p></figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="slide4.jpg" alt="HTML, CSS and JavaScript cards" loading="lazy">
          <figcaption><h2>The Core Trio</h2><p>HTML gives structure, CSS adds style, JavaScript adds behavior.</p></figcaption>
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="slide5.jpg" alt="A terminal with git commands and a commit graph" loading="lazy">
          <figcaption><h2>Ship It</h2><p>Commit your code, push to GitHub and go live.</p></figcaption>
        </figure>
      <span class="count" id="count">1 / 5</span>
      <button class="pp" id="pp" type="button" aria-label="Pause slideshow">
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="arrow prev" id="prev" type="button" aria-label="Previous slide"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="arrow next" id="next" type="button" aria-label="Next slide"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="dots" id="dots" role="group" aria-label="Slide indicators"></div>
      <div class="timer" aria-hidden="true"><i id="fill"></i></div>
    </section>
  </main>
<script src="script.js"></script>
</body>
</html>
